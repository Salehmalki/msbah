<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04100c" />
      <stop offset="55%" stop-color="#082119" />
      <stop offset="100%" stop-color="#0e3529" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04100c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />

  <!-- Outer subtle track ring -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#f0fdf4" stroke-opacity="0.14" stroke-width="6" />

  <!-- Progress arc -->
  <circle
    cx="256"
    cy="256"
    r="164"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="780 1031"
    transform="rotate(-90 256 256)"
  />

  <!-- Tasbeeh beads around perimeter -->
  <g fill="#34d399">
    <circle cx="256" cy="68" r="7" />
    <circle cx="305" cy="75" r="7" />
    <circle cx="350" cy="94" r="7" />
    <circle cx="389" cy="123" r="7" />
    <circle cx="418" cy="162" r="7" />
    <circle cx="437" cy="207" r="7" />
    <circle cx="444" cy="256" r="7" />
    <circle cx="437" cy="305" r="7" />
    <circle cx="418" cy="350" r="7" />
    <circle cx="389" cy="389" r="7" />
    <circle cx="350" cy="418" r="7" />
    <circle cx="305" cy="437" r="7" />
    <circle cx="256" cy="444" r="7" />
    <circle cx="207" cy="437" r="7" />
    <circle cx="162" cy="418" r="9" fill="#a7f3d0" />
  </g>
  <g fill="#f0fdf4" fill-opacity="0.22">
    <circle cx="123" cy="389" r="6" />
    <circle cx="94" cy="350" r="6" />
    <circle cx="75" cy="305" r="6" />
    <circle cx="68" cy="256" r="6" />
    <circle cx="75" cy="207" r="6" />
    <circle cx="94" cy="162" r="6" />
    <circle cx="123" cy="123" r="6" />
    <circle cx="162" cy="94" r="6" />
    <circle cx="207" cy="75" r="6" />
  </g>

  <!-- Inner medallion -->
  <circle cx="256" cy="256" r="134" fill="#061a13" fill-opacity="0.88" stroke="#f0fdf4" stroke-opacity="0.18" stroke-width="3" />

  <!-- Crescent moon -->
  <path
    d="M278 196a64 64 0 1 0 58 92a50 50 0 1 1-58-92z"
    fill="#34d399"
  />
  <!-- Star dot -->
  <circle cx="306" cy="224" r="9" fill="#ecfdf5" />
</svg>
